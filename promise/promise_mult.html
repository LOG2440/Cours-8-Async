<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemple pour Promise ALL et RACE</title>
    <style>
        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div id="spinner">Chargement...</div>
    <div id="game-screen" class="hidden">
        <h1>Temps de chargement total : <span id="load-time"></span> ms</h1>
    </div>
    <span id="error"></span>
    <section id="images"></section>
    <script>
        const spinner = document.getElementById('spinner');
        const loadTime = document.getElementById('load-time');
        const gameScreen = document.getElementById('game-screen');
        const error = document.getElementById('error');
        const imagesSection = document.getElementById('images');

        const initLoading = () => {
            spinner.style.display = 'block';
            gameScreen.classList.add('hidden');
            error.textContent = '';
            imagesSection.innerHTML = '';
            return Date.now();
        }
        const endLoading = (startTime) => {
            loadTime.textContent = Date.now() - startTime;
            spinner.style.display = 'none';
            gameScreen.classList.remove('hidden');
        }

        const preloadImage = (url, delay = 500) => {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    const img = new Image();
                    img.src = url;
                    img.onload = () => resolve(url);
                    img.onerror = () => reject(new Error(`Failed to load ${url}`));
                    imagesSection.appendChild(img);
                }, delay);
            });
        };

        function loadSequential() {
            const time = initLoading();
            preloadImage('https://picsum.photos/200?random=0')
                .then(() => preloadImage('https://picsum.photos/200?random=1'))
                .then(() => preloadImage('https://picsum.photos/200?random=2', 1000))
                .then(() => endLoading(time))
                .catch(err => {
                    endLoading(time);
                    error.textContent = `Erreur de chargement: ${err.message}`;
                });
        }

        function loadParallel() {
            const time = initLoading();
            // Promise.allSettled([ // remplacer pour voir la différence
            Promise.all([
                preloadImage('https://picsum.photos/200?random=0'),
                preloadImage('https://picsum.photos/200?random=1'),
                preloadImage('https://picsum.photos/200?random=2', 1000)
            ])
                .then(() => endLoading(time))
                .catch(err => {
                    endLoading(time);
                    error.textContent = `Erreur de chargement: ${err.message}`;
                });
        }



        function loadRace() {
            const time = initLoading();
            // Promise.any([  // invalider le premier URL avec un délai plus petit
            Promise.race([
                preloadImage('https://picsum.photos/200?random=0',250),
                preloadImage('https://picsum.photos/200?random=1'),
                preloadImage('https://picsum.photos/200?random=2', 1000)
            ])
                .then(() => endLoading(time))
                .catch(err => {
                    endLoading(time);
                    error.textContent = `Erreur de chargement: ${err.message}`;
                });
        }
    </script>
    <button onclick="loadSequential()">Charger séquentiellement</button>
    <button onclick="loadParallel()">Charger en parallèle</button>
    <button onclick="loadRace()">Charger en parallèle (course)</button>
</body>

</html>
